spring:
  application:
    name: nova-assistant
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nova}
    username: ${SPRING_DATASOURCE_USERNAME:nova}
    password: ${SPRING_DATASOURCE_PASSWORD:nova_secret}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}
      pool-name: nova-pool
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:nova_redis}
      timeout: 2000ms
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL:false}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

server:
  port: ${PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.nova.assistant: INFO
    org.springframework.security: WARN

nova:
  jwt:
    secret: ${NOVA_JWT_SECRET:change_me_to_a_long_random_64_char_secret_value_please_now_0000}
    access-ttl-minutes: ${NOVA_JWT_ACCESS_TTL_MINUTES:30}
    refresh-ttl-days: ${NOVA_JWT_REFRESH_TTL_DAYS:14}
    issuer: nova-assistant
  ai:
    provider: ${NOVA_AI_PROVIDER:openai}
    openai:
      api-key: ${NOVA_AI_OPENAI_API_KEY:}
      model: ${NOVA_AI_OPENAI_MODEL:gpt-4o-mini}
      base-url: ${NOVA_AI_OPENAI_BASE_URL:https://api.openai.com/v1}
      temperature: 0.6
      max-tokens: ${NOVA_AI_OPENAI_MAX_TOKENS:3072}
    models:
      fast: ${NOVA_AI_MODELS_FAST:openai/gpt-oss-20b}
      strong: ${NOVA_AI_MODELS_STRONG:openai/gpt-oss-120b}
      catalog: "${NOVA_AI_MODELS_CATALOG:openai/gpt-oss-120b|GPT-OSS 120B (potente),openai/gpt-oss-20b|GPT-OSS 20B (rápido),qwen/qwen3.8-27b|Qwen 3.8 27B}"
      whisper: ${NOVA_AI_MODELS_WHISPER:whisper-large-v3}
    gemini:
      api-key: ${NOVA_AI_GEMINI_API_KEY:}
      chat-model: ${NOVA_AI_GEMINI_CHAT_MODEL:gemini-3.8-flash}
      vision-model: ${NOVA_AI_GEMINI_VISION_MODEL:gemini-3.8-flash}
      notebook-model: ${NOVA_AI_GEMINI_NOTEBOOK_MODEL:gemini-3.8-flash}
      tts-model: ${NOVA_AI_GEMINI_TTS_MODEL:gemini-3.8-flash-lite-tts}
      podcast-tts-model: ${NOVA_AI_GEMINI_PODCAST_TTS_MODEL:gemini-3.8-flash-tts}
      live-model: ${NOVA_AI_GEMINI_LIVE_MODEL:gemini-3.8-live}
      fallback: ${NOVA_AI_GEMINI_FALLBACK:true}
      tts: ${NOVA_AI_GEMINI_TTS:true}
      live: ${NOVA_AI_GEMINI_LIVE:true}
    local:
      enabled: ${NOVA_AI_LOCAL_ENABLED:true}
      base-url: ${NOVA_AI_LOCAL_BASE_URL:http://localhost:8000/v1}
      model: ${NOVA_AI_LOCAL_MODEL:}
      api-key: ${NOVA_AI_LOCAL_API_KEY:local}
      label: ${NOVA_AI_LOCAL_LABEL:Local (OpenJarvis)}
  cors:
    allowed-origins: ${NOVA_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  upload:
    dir: ${NOVA_UPLOAD_DIR:uploads}
  search:
    enabled: ${NOVA_SEARCH_ENABLED:true}
    endpoint: ${NOVA_SEARCH_ENDPOINT:https://api.duckduckgo.com/}
  auth:
    registration-enabled: ${NOVA_AUTH_REGISTRATION_ENABLED:false}
  rate-limit:
    enabled: ${NOVA_RATE_LIMIT_ENABLED:true}
    auth-per-minute: ${NOVA_RATE_LIMIT_AUTH_PER_MINUTE:8}
    ai-per-minute: ${NOVA_RATE_LIMIT_AI_PER_MINUTE:30}
  soc:
    virustotal:
      api-key: ${NOVA_SOC_VIRUSTOTAL_API_KEY:}
    kev-watch:
      enabled: ${NOVA_SOC_KEV_WATCH_ENABLED:true}
      vendors: "${NOVA_SOC_KEV_WATCH_VENDORS:Fortinet,Microsoft,Cisco,Palo Alto,Ivanti,Citrix,VMware,Apache,Linux,Google,Apple,Oracle,SonicWall,Juniper,Atlassian}"
