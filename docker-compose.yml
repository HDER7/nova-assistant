name: nova-assistant

services:
  postgres:
    image: postgres:16-alpine
    container_name: nova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nova}
      POSTGRES_USER: ${POSTGRES_USER:-nova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nova_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nova} -d ${POSTGRES_DB:-nova}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nova-net

  redis:
    image: redis:7-alpine
    container_name: nova-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-nova_redis}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-nova_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nova-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nova-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nova}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-nova}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-nova_secret}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-nova_redis}
      NOVA_JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_64_char_secret_value_please_now_0000}
      NOVA_JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-30}
      NOVA_JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-14}
      NOVA_AI_PROVIDER: ${AI_PROVIDER:-openai}
      NOVA_AI_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NOVA_AI_OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      NOVA_AI_OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      NOVA_SOC_VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      NOVA_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - nova-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: nova-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - nova-net

volumes:
  postgres_data:
  redis_data:

networks:
  nova-net:
    driver: bridge
