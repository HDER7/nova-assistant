# NOVA backend on Render (free). Deploy via "New > Blueprint" pointing at this repo.
# Secrets (sync:false) are filled in the Render dashboard, never committed.
services:
  - type: web
    name: nova-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: docker
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC"
      # --- AI (Groq, OpenAI-compatible) ---
      - key: NOVA_AI_PROVIDER
        value: openai
      - key: NOVA_AI_OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: NOVA_AI_OPENAI_MODEL
        value: llama-3.3-70b-versatile
      - key: NOVA_AI_OPENAI_API_KEY
        sync: false
      # --- VirusTotal ---
      - key: NOVA_SOC_VIRUSTOTAL_API_KEY
        sync: false
      # --- Security ---
      - key: NOVA_JWT_SECRET
        sync: false
      # --- PostgreSQL (Neon) ---
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # --- Redis (Upstash, TLS) ---
      - key: SPRING_DATA_REDIS_HOST
        sync: false
      - key: SPRING_DATA_REDIS_PORT
        value: "6379"
      - key: SPRING_DATA_REDIS_PASSWORD
        sync: false
      - key: SPRING_DATA_REDIS_SSL
        value: "true"
      # --- CORS (set to your Vercel URL after deploying the frontend) ---
      - key: NOVA_CORS_ALLOWED_ORIGINS
        sync: false
